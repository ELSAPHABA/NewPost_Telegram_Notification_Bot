[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-notification-bot"
version = "0.1.0"
description = "A Telegram bot that monitors websites for new posts and sends notifications."
authors = [
  { name = "Your Name", email = "your.email@example.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-telegram-bot>=20.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/telegram-notification-bot"
"Bug Tracker" = "https://github.com/yourusername/telegram-notification-bot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]  # Include all files in the root directory as package modules
exclude = ["tests*"]
