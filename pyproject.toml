[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NewPost_Telegram_Notification_Bot"
version = "0.1.0"
description = "A Telegram bot that monitors websites and sends notifications. Supports DCInside MiniPC, SFF Gallery, 2CPU, and ShopBack alerts."
authors = [
  { name = "ELSAPHABA", email = "sb07907@naver.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-telegram-bot[job-queue]>=22.7",
    "beautifulsoup4>=4.14.3",
    "requests[socks]>=2.33.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
"Homepage" = "https://github.com/ELSAPHABA/NewPost_Telegram_Notification_Bot"
"Bug Tracker" = "https://github.com/ELSAPHABA/NewPost_Telegram_Notification_Bot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]  # Include all files in the root directory as package modules
exclude = ["tests*"]
