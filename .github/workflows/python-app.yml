name: Deploy Python App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 파일 직접 실행
            cd /home/elsaphaba/HongDev/NewPost_Telegram_Notification_Bot
            
            # 최신 코드 가져오기
            git pull origin main

            # .env 파일 생성 (토큰 주입)
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env

            # 가상환경 패키지 설치 (pyproject.toml)
            source /home/elsaphaba/HongDev/HongDevVenv/bin/activate
            pip install .

            # 서비스 재시작
            sudo systemctl restart NewPost_Telegram_Notification_Bot

            # Docker 배포
            # docker build -t telegram-notification-bot .
            # docker rm -f telegram-notification-bot || true
            # docker run -d \
            #   --name telegram-notification-bot \
            #   --restart unless-stopped \
            #   --env-file .env \
            #   -v telegram-notification-bot-data:/data \
            #   telegram-notification-bot